# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Test with pytest
      run: |
        uv run pytest --cov=browse --cov-fail-under=80 tests

    - name: Test sync_prod_to_gcp unit tests
      # Only the fake-based tests; the other sync tests need a real bucket and credentials.
      run: uv run pytest script/sync_prod_to_gcp/test/test_retire_*.py

    - name: Ruff lint check
      run: |
        uv pip install ruff
        uv run ruff check --output-format=github browse
